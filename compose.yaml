services:
  shinkaimon-hub-anshar:
    image: polylvst/shinkaimon-hub-anshar:latest
    container_name: shinkaimon-hub-anshar
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://shinkaimon:shinkaimon@hub-db-anshar:5432/shinkaimon_hub
      # Warning changing these require full refresh face embeddings
      # You can do this by thrashing all user then re upload users
      # ~ PolyLvst
      - FACE_MODEL_NAME=ArcFace
      - FACE_BACKEND_NAME=opencv
      - FACE_DISTANCE_METRIC=cosine
      # Attendance forwarding to erina + the WhatsApp gateway. Off unless you
      # set FORWARD_ENABLED=true in .env; see .env.example for the whole block.
      - FORWARD_ENABLED=${FORWARD_ENABLED:-false}
      - FORWARD_INTERVAL_SECONDS=${FORWARD_INTERVAL_SECONDS:-30}
      - FORWARD_BATCH_SIZE=${FORWARD_BATCH_SIZE:-50}
      - FORWARD_MAX_ATTEMPTS=${FORWARD_MAX_ATTEMPTS:-10}
      - FORWARD_MAX_AGE_HOURS=${FORWARD_MAX_AGE_HOURS:-72}
      - ERINA_BASE_URL=${ERINA_BASE_URL:-}
      - ERINA_APP_CLIENT=${ERINA_APP_CLIENT:-erina-admin}
      - ERINA_ATTENDANCE_TIPE=${ERINA_ATTENDANCE_TIPE:-HADIR}
      - ERINA_CACHE_TTL_HOURS=${ERINA_CACHE_TTL_HOURS:-12}
      - WA_BASE_URL=${WA_BASE_URL:-}
      - WA_USERNAME=${WA_USERNAME:-}
      - WA_PASSWORD=${WA_PASSWORD:-}
    restart: unless-stopped
    volumes:
      - ./.deepface:/root/.deepface
    depends_on:
      hub-db-anshar:
        condition: service_healthy

  shinkaimon-hub-fe-anshar:
    image: polylvst/shinkaimon-hub-fe-anshar:latest
    container_name: shinkaimon-hub-fe-anshar
    ports:
      - "3001:80"
    environment:
      - BACKEND_PORT=8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - shinkaimon-hub-anshar
    restart: unless-stopped

  hub-db-anshar:
    image: pgvector/pgvector:pg16
    container_name: hub-db-anshar
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=shinkaimon
      - POSTGRES_PASSWORD=shinkaimon
      - POSTGRES_DB=shinkaimon_hub
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinkaimon -d shinkaimon_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hub_pgdata:
